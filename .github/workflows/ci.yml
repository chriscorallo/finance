name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder values so `next build` can run without a real Supabase
  # project. Never set real secrets here — production/staging secrets live
  # in encrypted Vercel environment variables, not in this workflow file.
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key"
  SUPABASE_SECRET_KEY: "placeholder-secret-key"
  PROVIDER_TOKEN_ENCRYPTION_KEY: "cGxhY2Vob2xkZXItcGxhY2Vob2xkZXItMzJieXRlcyE="
  OWNER_EMAIL: "owner@example.com"

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test -- --coverage

      - name: Build
        run: pnpm run build

      - name: Verify no secrets leaked into the client bundle
        run: |
          if grep -rE "PROVIDER_TOKEN_ENCRYPTION_KEY|SUPABASE_SECRET_KEY" .next/static 2>/dev/null; then
            echo "Server-only secret name found in client bundle output" >&2
            exit 1
          fi
